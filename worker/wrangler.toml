# the contact form's postie, sat in front of the site on the one path it answers
name = "peng-ly-contact"
main = "index.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "peng.ly/api/contact", zone_name = "peng.ly" }]
send_email = [{ name = "EMAIL" }]
ratelimits = [{ name = "LIMITER", namespace_id = "1001", simple = { limit = 3, period = 60 } }]
observability = { enabled = true }
